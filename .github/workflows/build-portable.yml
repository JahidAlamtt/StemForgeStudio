name: Build standalone StemForge apps (no Python/FFmpeg for users)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Portable ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows-x64
            os: windows-2022
            cpu_wheels: true
          - label: Linux-x64
            os: ubuntu-22.04
            cpu_wheels: true
          - label: macOS-Intel
            os: macos-15-intel
            cpu_wheels: false
          - label: macOS-Apple-Silicon
            os: macos-15-xlarge
            cpu_wheels: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python for CI BUILD only (not needed by end users)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
                    cache-dependency-path: requirements-build.txt
      - name: Build-time dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-build.txt
      - name: CPU PyTorch, Windows and Linux
        if: ${{ matrix.cpu_wheels }}
        shell: bash
        run: |
          python -m pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - name: PyTorch for macOS
        if: ${{ !matrix.cpu_wheels }}
        shell: bash
        run: |
          python -m pip install torch==2.3.1 torchaudio==2.3.1
      - name: Validate installed runtime (FFmpeg bundled through imageio-ffmpeg)
        shell: bash
        run: |
          python app.py --self-test
          python -m unittest discover -s tests -v
      - name: Compile portable application
        shell: bash
        run: |
          python build_portable.py
      - name: Smoke-test bundle and create OS download
        shell: bash
        run: |
          python package_portable.py
      - name: Upload ready-to-run app (not source code)
        uses: actions/upload-artifact@v4
        with:
          name: StemForge-${{ matrix.label }}
          path: release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
